name: legalmind

services:
  database:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legalmind}
      POSTGRES_USER: ${POSTGRES_USER:-legalmind_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

  ollama-models:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull ${LOCAL_AI_MODEL:-llama3.1:8b} &&
        ollama pull ${LOCAL_AI_EMBEDDING_MODEL:-nomic-embed-text}

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-legalmind_app}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-legalmind}?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET en deploy/.env}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      FRONTEND_URLS: ${PUBLIC_URL:-http://localhost}
      LOCAL_AI_BASE_URL: http://ollama:11434
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-llama3.1:8b}
      LOCAL_AI_EMBEDDING_MODEL: ${LOCAL_AI_EMBEDDING_MODEL:-nomic-embed-text}
      LOCAL_AI_TIMEOUT_MS: ${LOCAL_AI_TIMEOUT_MS:-120000}
      LOCAL_AI_EMBEDDING_TIMEOUT_MS: ${LOCAL_AI_EMBEDDING_TIMEOUT_MS:-30000}
      LOCAL_AI_MAX_OUTPUT_TOKENS: ${LOCAL_AI_MAX_OUTPUT_TOKENS:-900}
      LOCAL_AI_CONTEXT_SIZE: ${LOCAL_AI_CONTEXT_SIZE:-8192}
      LOCAL_AI_TEMPERATURE: ${LOCAL_AI_TEMPERATURE:-0.1}
      LOCAL_AI_KEEP_ALIVE: ${LOCAL_AI_KEEP_ALIVE:-15m}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-180}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-120000}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-10000}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
      AUDIT_HASH_SALT: ${AUDIT_HASH_SALT:?Defina AUDIT_HASH_SALT en deploy/.env}
      UPLOADS_DIR: /data/uploads
      OCR_CACHE_PATH: /data/ocr-cache
      OCR_LANGUAGE: ${OCR_LANGUAGE:-spa}
      OCR_PDF_SCALE: ${OCR_PDF_SCALE:-2}
      DOCUMENT_WORKER_INTERVAL_MS: ${DOCUMENT_WORKER_INTERVAL_MS:-3000}
      REMINDER_WORKER_INTERVAL_MS: ${REMINDER_WORKER_INTERVAL_MS:-30000}
    volumes:
      - uploads_data:/data/uploads
      - ocr_cache:/data/ocr-cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 20

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_LEGALMIND_API_URL: ${PUBLIC_URL:-http://localhost}
        NEXT_PUBLIC_AUTH_API_URL: ${PUBLIC_URL:-http://localhost}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 20

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
  ocr_cache:
  caddy_data:
  caddy_config:
